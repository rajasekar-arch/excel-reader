<div>
  <h1>Upload your Excel file </h1>
  <div>
    <form class="example-form">
      <mat-form-field class="example-full-width">
        <mat-label>Name</mat-label>
        <input readonly="true" matInput placeholder="Upload excel file" [(ngModel)]="fileName" [ngModelOptions]="{standalone: true}" >
        <input type="file" hidden #fileUpload (change)="onFileSelected($event)" />
      </mat-form-field>
      <button mat-mini-fab color="primary" class="upload-btn" (click)="fileUpload.click()">
        <mat-icon>attach_file</mat-icon>
      </button>
      <button type="button" (click)="onUpload()" mat-button>Submit</button>
    </form>
  </div>
</div>




<router-outlet />
